<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Runner</title>
    <link rel="stylesheet" href="style.css">
   
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
</head>
<body>

    <!-- Start Screen -->
    <div id="startScreen">
        <button id="selectFolder"class="button">📂 Select Folder</button>
    </div>

    <!-- Browser UI -->
    <div id="runScreen">
        <div id="browserBar">
            <button id="backBtn" class="button"><i class="fa-solid fa-arrow-left"></i></button>
            <button id="refresh" class="button"><i class="fa-solid fa-rotate-right"></i></button>

            <input type="text" id="addressBar" readonly>
            <button id="devtools" class="button"><i class="fa-solid fa-code"></i></button>
            <button id="closeBtn" class="button"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div id="webpage">
        <iframe id="runner"></iframe>
    </div>
         <!-- Console Window -->
   

    <script src="console.min.js"></script>
    <script src="consoleadjust.js"></script>
    </div>

    <script src="index.js"></script>

</body>
</html>
