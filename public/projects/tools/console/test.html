<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        .console-container {
          background-color: #1c1c25;
          border-radius: 4px;
          font-family: monospace;
          height: 100vh;
          overflow-y: auto;
          padding: 8px;
          color: #ffffff;
          width: 30%;
          right: 0;
          top: 0;
          position: fixed;
          border-left: #0004ff solid 1px;
          padding-top: 20px;
          transform: translateX(100%);
          transition: transform 0.3s ease;
        }

        .console-container.show {
          transform: translateX(0);
        }

        .console-toggle {
          position: fixed;
          bottom: 20px;
          right: 20px;
          width: 40px;
          height: 40px;
          border-radius: 9px;
          background: #1c1c25;
          border: 3px solid #ff0000;
          color: rgb(255, 233, 138);
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          font-family: monospace;
          font-size: 18px;
          z-index: 1000;
          transition: background-color 0.5s;
          transition:transform 0.5s;
        }

        .console-toggle:hover {
          background: #000065;
          transform: scale(1.1);

        }
    
        .console-line {
          padding: 4px 0;
          display: flex;
          align-items: flex-start;
          border-bottom: 1px solid #363636;
        }
    
        .console-icon {
          margin-right: 8px;
          font-weight: bold;
        }
    
        .console-text {
          word-break: break-all;
          flex: 1;
        }
    
        .console-counter {
          background: #444;
          color: #fff;
          padding: 1px 6px;
          border-radius: 10px;
          margin-left: 8px;
          font-size: 0.9em;
        }
    
        .obj-brace { color: #ffffff; }
        .obj-key { color: #9cdcfe; }
        .obj-colon { color: #ffffff; margin: 0 4px; }
        .obj-comma { color: #ffffff; margin-right: 4px; }
        .obj-string { color: #ce9178; }
        .obj-number { color: #b5cea8; }
        .obj-boolean { color: #569cd6; }
        .obj-null { color: #569cd6; }
        .obj-undefined { color: #569cd6; }
        .obj-function { color: #dcdcaa; }
    
        .log { color: #ffffff; }
        .error { color: #ff5757; }
        .error .console-icon::before { content: '×'; color: #ff5757; }
        .warning { color: #ffbd2e; }
        .warning .console-icon::before { content: '⚠'; color: #ffbd2e; }
        .log .console-icon::before { content: '>'; color: #ffffff; }
    
        .error-stack {
          color: #ff8080;
          font-size: 0.9em;
          margin-top: 4px;
          white-space: pre-wrap;
        }
    </style>

    <script>
        // Create toggle button
        const toggleButton = document.createElement('button');
        toggleButton.classList.add('console-toggle');
        toggleButton.innerHTML = '{}';
        document.body.appendChild(toggleButton);
        
        const consoleElement = document.createElement('div');
        consoleElement.classList.add('console-container');
        consoleElement.innerHTML = `
        <div class="console-line log">
          <span class="console-icon"></span>
          <span class="console-text">Console ready</span>
        </div>`;
        consoleElement.id = 'console';
        document.body.appendChild(consoleElement);

        // Toggle functionality
        toggleButton.addEventListener('click', () => {
            consoleElement.classList.toggle('show');
        });

        let lastMessage = { text: '', type: '', count: 0, element: null };

        function formatValue(value) {
            if (typeof value === 'string') {
                return `<span class="obj-string">"${value}"</span>`;
            } else if (typeof value === 'number') {
                return `<span class="obj-number">${value}</span>`;
            } else if (typeof value === 'boolean') {
                return `<span class="obj-boolean">${value}</span>`;
            } else if (value === null) {
                return `<span class="obj-null">null</span>`;
            } else if (value === undefined) {
                return `<span class="obj-undefined">undefined</span>`;
            } else if (typeof value === 'function') {
                return `<span class="obj-function">ƒ ${value.name || '(anonymous)'}</span>`;
            } else if (Array.isArray(value)) {
                return formatArray(value);
            } else if (typeof value === 'object') {
                return formatObject(value);
            }
            return value.toString();
        }

        function formatArray(arr) {
            const items = arr.map(item => formatValue(item)).join('<span class="obj-comma">,</span>');
            return `<span class="obj-brace">[</span>${items}<span class="obj-brace">]</span>`;
        }

        function formatObject(obj) {
            if (obj === null) return '<span class="obj-null">null</span>';
            
            const pairs = Object.entries(obj).map(([key, value]) => {
                return `<span class="obj-key">${key}</span><span class="obj-colon">:</span>${formatValue(value)}`;
            }).join('<span class="obj-comma">,</span>');
            
            return `<span class="obj-brace">{</span>${pairs}<span class="obj-brace">}</span>`;
        }
        
        function appendConsoleMessage(content, type = 'log') {
            const line = document.createElement('div');
            line.className = `console-line ${type}`;
            
            const icon = document.createElement('span');
            icon.className = 'console-icon';
            
            const textSpan = document.createElement('span');
            textSpan.className = 'console-text';

            if (content instanceof Error) {
                textSpan.textContent = content.message;
                if (content.stack) {
                    const stackSpan = document.createElement('div');
                    stackSpan.className = 'error-stack';
                    stackSpan.textContent = content.stack;
                    textSpan.appendChild(stackSpan);
                }
            } else if (typeof content === 'object') {
                textSpan.innerHTML = formatValue(content);
            } else {
                textSpan.textContent = String(content);
            }
            
            line.appendChild(icon);
            line.appendChild(textSpan);
            consoleElement.appendChild(line);
            
            consoleElement.scrollTop = consoleElement.scrollHeight;
        }

        const console = {
            log: function(message) {
                appendConsoleMessage(message);
            },
            warn: text => appendConsoleMessage(text, 'warning'),
            error: text => appendConsoleMessage(text, 'error')
        };

        const testScript = (script) => {
            try {
                const result = script;
                result();
            } catch (e) {
                console.error(e);
            }
        }

        // Test the console
        testScript(() => {
            console.log('This is a warning message');
        });
    </script>
</body>
</html>
