<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        const style = document.createElement("style");
style.textContent = `.console-container {background-color: #1c1c25;border-radius: 4px;font-family: monospace;height: 100vh;overflow-y: auto;padding: 8px;color: #ffffff;width: 30%;right: 0;top: 0;position: fixed;border-left: #0004ff solid 1px;padding-top: 20px;transform: translateX(100%);transition: transform 0.3s ease;}.console-container.show {transform: translateX(0);}.console-tabs {display: flex;position: fixed;top: 0;left:0;background: #15151d;width: 30%;border-left: #0004ff solid 1px;}.tab-button {background: none;border: none;color: #ffffff;cursor: pointer;font-family: monospace;}.tab-button.active {background: #1c1c25;border-bottom: 2px solid #0004ff;}.console-toggle {position: fixed;bottom: 15px;right: 15px;width: 40px;height: 40px;border-radius: 9px;background: #1c1c25;border: 3px solid #ff0000;color: rgb(255, 233, 138);cursor: pointer;display: flex;align-items: center;justify-content: center;font-family: monospace;font-size: 18px;z-index: 1000;transition: background-color 0.5s, transform 0.5s;}.console-toggle:hover {background: #000065;transform: scale(1.1);}.console-line {padding: 4px 0;display: flex;align-items: flex-start;border-bottom: 1px solid #363636;}.console-icon {margin-right: 8px;font-weight: bold;}.console-text {word-break: break-all;flex: 1;}.console-counter {background: #444;color: #fff;padding: 1px 6px;border-radius: 10px;margin-left: 8px;font-size: 0.9em;}.performance-container {display: none;padding: 16px;}.performance-container.show {display: block;}.performance-metric {margin-bottom: 16px;}.performance-label {color: #9cdcfe;margin-bottom: 4px;}.performance-value {font-size: 24px;color: #b5cea8;}.performance-chart {height: 100px;background: #15151d;margin-top: 8px;position: relative;border:green solid 2px;border-top:rgb(0,255,0) solid 2px}.chart-bar {position: absolute;bottom: 0;width: 2px;background: #0004ff;}.obj-brace { color: #ffffff; }.obj-key { color: #9cdcfe; }.obj-colon { color: #ffffff; margin: 0 4px; }.obj-comma { color: #ffffff; margin-right: 4px; }.obj-string { color: #ce9178; }.obj-number { color: #b5cea8; }.obj-boolean { color: #569cd6; }.obj-null { color: #569cd6; }.obj-undefined { color: #569cd6; }.obj-function { color: #dcdcaa; }.log { color: #ffffff; }.error { color: #ff5757; }.error .console-icon::before { content: '×'; color: #ff5757; }.warning { color: #ffbd2e; }.warning .console-icon::before { content: '⚠'; color: #ffbd2e; }.log .console-icon::before { content: '>'; color: #ffffff; }.error-stack {color: #ff8080;font-size: 0.9em;margin-top: 4px;white-space: pre-wrap;}`;
document.head.appendChild(style);

// Create container and tabs
const container = document.createElement("div");
container.classList.add("console-container");

const tabsContainer = document.createElement("div");
tabsContainer.classList.add("console-tabs");

const consoleTab = document.createElement("button");
consoleTab.classList.add("tab-button", "active");
consoleTab.textContent = "Console";

const performanceTab = document.createElement("button");
performanceTab.classList.add("tab-button");
performanceTab.textContent = "Performance";

tabsContainer.appendChild(consoleTab);
tabsContainer.appendChild(performanceTab);

// Create content containers
const consoleContent = document.createElement("div");
consoleContent.innerHTML = `<div class="console-line log"><span class="console-icon"></span><span class="console-text">-- Console logs will appear here: --</span></div>`;
consoleContent.id = "console";

const performanceContent = document.createElement("div");
performanceContent.classList.add("performance-container");
performanceContent.innerHTML = `
  <div class="performance-metric">
    <div class="performance-label">FPS</div>
    <div class="performance-value" id="fps-value">0</div>
    <div class="performance-chart" id="fps-chart"></div>
  </div>
  <div class="performance-metric">
    <div class="performance-label">Memory Usage</div>
    <div class="performance-value" id="memory-value">0 MB</div>
  </div>
`;

container.appendChild(tabsContainer);
container.appendChild(consoleContent);
container.appendChild(performanceContent);

const toggleButton = document.createElement("button");
toggleButton.classList.add("console-toggle");
toggleButton.innerHTML = "{}";

document.body.appendChild(container);
document.body.appendChild(toggleButton);

// Tab switching logic
consoleTab.addEventListener("click", () => {
  consoleTab.classList.add("active");
  performanceTab.classList.remove("active");
  consoleContent.style.display = "block";
  performanceContent.classList.remove("show");
});

performanceTab.addEventListener("click", () => {
  performanceTab.classList.add("active");
  consoleTab.classList.remove("active");
  consoleContent.style.display = "none";
  performanceContent.classList.add("show");
});

toggleButton.addEventListener("click", () => {
  container.classList.toggle("show");
});

// Performance monitoring
let lastTime = performance.now();
let frames = 0;
const fpsHistory = new Array(50).fill(0);
let historyIndex = 0;

// Create initial FPS bars
const fpsChart = document.getElementById("fps-chart");
fpsHistory.forEach(() => {
  const bar = document.createElement("div");
  bar.classList.add("chart-bar");
  fpsChart.appendChild(bar);
});

function updatePerformance() {
  const now = performance.now();
  frames++;

  // Update FPS every second
  if (now - lastTime >= 800) {
    const fps = Math.round(frames * 1000 / (now - lastTime));
    document.getElementById("fps-value").textContent = fps;

    // Update FPS history
    fpsHistory[historyIndex] = fps;
    historyIndex = (historyIndex + 1) % fpsHistory.length;

    // Update chart
    const bars = fpsChart.getElementsByClassName("chart-bar");
    const maxFps = Math.max(...fpsHistory, 60);
    fpsHistory.forEach((fps, i) => {
      const barIndex = (historyIndex + i) % fpsHistory.length;
      const height = (fps / maxFps) * 100;
      bars[barIndex].style.height = `${height}%`;
      bars[barIndex].style.left = `${(i / fpsHistory.length) * 100}%`;
      bars[barIndex].style.backgroundColor = `rgb(0, 255, ${0 })`
    });

    // Update memory usage if available
    if (window.performance && performance.memory) {
      const memoryUsage = Math.round(performance.memory.usedJSHeapSize / (1024 * 1024));
      document.getElementById("memory-value").textContent = `${memoryUsage} MB`;
    }

    frames = 0;
    lastTime = now;
  }

  requestAnimationFrame(updatePerformance);
}

// Console functionality
let lastMessage = { content: null, type: null, element: null, count: 1 };

function appendConsoleMessage(content, type = "log") {
  /* Formatting functions*/
  function formatValue(value) {
    if (typeof value === "string") {
      return `<span class="obj-string">"${value}"</span>`;
    } else if (typeof value === "number") {
      return `<span class="obj-number">${value}</span>`;
    } else if (typeof value === "boolean") {
      return `<span class="obj-boolean">${value}</span>`;
    } else if (value === null) {
      return `<span class="obj-null">null</span>`;
    } else if (value === undefined) {
      return `<span class="obj-undefined">undefined</span>`;
    } else if (typeof value === "function") {
      return `<span class="obj-function">ƒ ${value.name || "(anonymous)"}</span>`;
    } else if (Array.isArray(value)) {
      return formatArray(value);
    } else if (typeof value === "object") {
      return formatObject(value);
    }
    return value.toString();
  }

  function formatArray(arr) {
    const items = arr
      .map((item) => formatValue(item))
      .join('<span class="obj-comma">,</span>');
    return `<span class="obj-brace">[</span>${items}<span class="obj-brace">]</span>`;
  }

  function formatObject(obj) {
    if (obj === null) return '<span class="obj-null">null</span>';
    const pairs = Object.entries(obj)
      .map(([key, value]) => {
        return `<span class="obj-key">${key}</span><span class="obj-colon">:</span>${formatValue(value)}`;
      })
      .join('<span class="obj-comma">,</span>');
    return `<span class="obj-brace">{</span>${pairs}<span class="obj-brace">}</span>`;
  }

  const contentString = typeof content === 'object' ? JSON.stringify(content) : String(content);
  
  if (lastMessage.content === contentString && lastMessage.type === type && lastMessage.element) {
    lastMessage.count++;
    let counter = lastMessage.element.querySelector('.console-counter');
    if (!counter) {
      counter = document.createElement('span');
      counter.className = 'console-counter';
      lastMessage.element.appendChild(counter);
    }
    counter.textContent = `${lastMessage.count}x`;
    return;
  }

  const line = document.createElement("div");
  line.className = `console-line ${type}`;
  
  const icon = document.createElement("span");
  icon.className = "console-icon";
  
  const textSpan = document.createElement("span");
  textSpan.className = "console-text";

  if (content instanceof Error) {
    textSpan.textContent = content.message;
    if (content.stack) {
      const stackSpan = document.createElement("div");
      stackSpan.className = "error-stack";
      stackSpan.textContent = content.stack;
      textSpan.appendChild(stackSpan);
    }
  } else if (typeof content === "object") {
    textSpan.innerHTML = formatValue(content);
  } else {
    textSpan.textContent = String(content);
  }

  line.appendChild(icon);
  line.appendChild(textSpan);
  consoleContent.appendChild(line);
  consoleContent.scrollTop = consoleContent.scrollHeight;

  lastMessage = {
    content: contentString,
    type: type,
    element: line,
    count: 1
  };
}

const originalConsole = { ...console };
console.log = function (message) {
  originalConsole.log(message);
  appendConsoleMessage(message);
};
console.warn = function (message) {
  originalConsole.warn(message);
  appendConsoleMessage(message, "warning");
};
console.error = function (message) {
  originalConsole.error(message);
  appendConsoleMessage(message, "error");
};

// Start performance monitoring
requestAnimationFrame(updatePerformance);

const testScript = (script) => {
  if (typeof script !== "function") return;
  try {
    const result = script;
    result();
  } catch (e) {
    console.error(e);
  }
};
    </script>
</body>
</html>
