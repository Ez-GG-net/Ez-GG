<html>
  <head>

    <style>
      b {

      }

      }

        position: fixed;

    <script>
      writing = false;
      const console = {
        writeLine: (stuff) => {
          if (!writing) {
            document.getElementById("main").innerHTML += `<br>` + stuff;
          } else {
            setTimeout(() => {
              console.writeLine(stuff);
            }, 200);
          }
        },
        writeDelayed: (stuff, delay, color = `white`, n = 0) => {
          letter = stuff.split(``);
          if (delay == undefined) {
            delay = 40;
          }
          if (n <= 0) {
            document.getElementById("main").innerHTML += `<br>`;
          }

          document.getElementById(
            "main"
          ).innerHTML += `<output style="color: ${color}">${letter[n]}</output>`;

          let t = n + 1;
          if (letter[letter.length] == letter[t]) {
            return (writing = false);
          }
          writing = true;
          setTimeout(() => {
            console.writeDelayed(stuff, delay, color, t);
          }, delay/2);
        },
        clear: () => {
          document.getElementById("main").innerHTML = "";
        },
        writeQuest: (stuff, delay, n = 0) => {
          letter = stuff.split(``);
          if (delay == undefined) {
            delay = letter.length;
          }
          if (n <= 0) {
            document.getElementById("quest").innerHTML = ``;
          }

          document.getElementById("quest").innerHTML += `${letter[n]}`;

          let t = n + 1;
          if (letter[letter.length] == letter[t]) {
            return;
          }
          setTimeout(() => {
            console.writeQuest(stuff, delay, t);
          }, delay);
        },
        write: (stuff) => {
          document.getElementById("main").innerHTML += stuff;
        },
      };
      let player = {
        health: 20,
        power: 5,
        energy: 100,
        hunger: 100,

        setTimeout(() => {
          console.clear();

        /*  setTimeout(()=>{console.writeLine("ur computr sloo")}, 4000);
   
    setTimeout(()=>{console.writeLine("prob get computr not ptoato")}, 12000)
    setTimeout(()=>{console.writeLine("finally its done...")}, 20000-800)*/
      }
