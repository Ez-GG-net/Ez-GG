/**
 * A Scene Contrustor that is used to render a scene of Game Objects
 * @param {Object} [options] Options for the Scene
 * @param {String} [options.name] Name of the scene
 * @param {Number} [options.renderRate] How many times per second the scene should update/render
 * @param {String} [options.backgroundColor] Background color for the scene
 * @param {Number} [options.friction] How much the friction will decrease any Objects Speed on the scene
 */
function Scene(options){
    this.name = options.name
    this.renderRate = options.renderRate?options.renderRate:300;
    this.backgroundColor = options.backgroundColor || 'black'
    this.gameObjects = []
    this.lights = []

    this.listeners = []

    this.center = {
        x:  document.querySelector('#GameCanvas').width/2,
        y:  document.querySelector('#GameCanvas').height/2
    }
   this.id = ScenecanvasListeners.length
  
   this.friction = options.friction==undefined ? 0.50 : options.friction
}
/**
 * Adds a GameObject to the Scene.
 * @param  {...GameObject2D} GameObjects The GameObjects to add to the scene
 */
Scene.prototype.add = function (...GameObjects){
   
    this.gameObjects.push(...GameObjects)
}

 * Adds a Light to the Scene.

const keypressed = {
   
}
const InputManager = function (data){
       
    if (data.type === 'keydown' || data.type === 'keypress') {
        if (data.input == ' ') {
            keypressed['space'] = true
        }
    keypressed[data.input] = true
    } 
     if (data.type === 'keyup'){
        if (data.input == ' ') {
            keypressed['space'] = false
        }
        keypressed[data.input] = false
    }

}
const SceneEventListener = (e)=>{
    if (e.key) {
InputManager({input:e.key, type:e.type})
    }
    ScenecanvasListeners.forEach(scene=>{
        const CameraOffset = {x:currentCamera.x-currentScene.center.x,y:currentCamera.y-currentScene.center.y}
        scene.listeners.forEach(listener=>{
        if (listener.listener === e.type ) {
              

               
                
                listener.func({
                    x:e.clientX+CameraOffset.x,
                    y:e.clientY+CameraOffset.y,
                    key:e.key
                })
            
        }
    })
    })
}
/**
 * Adds a listener to the specified Scene.
 * 
 * 
 * @param {SceneListener} listener The listener to watch for.
 * @param {Function} func The function to call/run when the listener is heard.
 */
Scene.prototype.addEventListener = function(listener, func){
    this.listeners.push({listener:listener, func:func})
    ScenecanvasListeners[this.id] = this

    //* Add the extra event listeners
    document.addEventListener('keydown',SceneEventListener)
    document.addEventListener('keypress',SceneEventListener)
    document.addEventListener('keyup',SceneEventListener)
}

const Text2D = function(text,x,y,options){
    if (options) {
    options = {...options,...{
        color: 'black',
        fontSize: '12px',
        fontStyle: 'Arial'
    }}
} else {
    options = {
        color: 'black',
        fontSize: '12px',
        fontStyle: 'Arial'
    }
}
    
    this.text = text
    this.x = x
    this.y = y
    this.color = options.color
    this.fontSize = options.fontSize
    this.fontStyle = options.fontStyle


}




/**
 * @param {Object} [options] The options for light rendering (Not needed unless geometry.type is set to AmbientLight)
 * @param {Number} [options.rays] How many rays to raycast when rendering lighting (Default: 360)
 * @param {String} [options.color] The color of the light (Default: White)
 * @param {Boolean} [options.fade] Whether to fade the light as it gets farther away (Defualt: false)
 * @param {Boolean} [options.intensity] How brightly the light will shine. (Defualt: 0.5)
 * @param {Number} [options.rotation] What rotation the light be (Default: 0)
 */
function Light2D(options, position) {
  
        this.rays = options.rays===undefined?360:options.rays
        this.color = options.color || 'white'
        this.fade = options.fade===undefined?false:options.fade
        this.intensity = options.intensity===undefined?0.5:options.intensity

        this.x = position?.x || 0
    this.y = position?.y || 0
    this.rotation = options.rotation||0;

    this.opacity = 1;

Camera.prototype.moveStepTowardsPosition = function(targetX, targetY, stepSize) {
    // Calculate the direction vector
    const dx = targetX - this.x;
    const dy = targetY - this.y;
    const distance = Math.sqrt(dx * dx + dy * dy);

    // If the distance is less than or equal to the step size, move directly to the target
    if (distance <= stepSize) {
        this.x = targetX;
        this.y = targetY;
    } else {
        // Normalize the direction vector
        const unitX = dx / distance;
        const unitY = dy / distance;

        // Move the camera by the step size in the direction of the target
        this.x += unitX * stepSize;
        this.y += unitY * stepSize;
    }
};

            obj1.x < obj2.x + obj2.width &&
            obj1.x + obj1.width > obj2.x &&
            obj1.y < obj2.y + obj2.height &&
            obj1.y + obj1.height > obj2.y
        );
    }
        function getCollisionPointFromCircles(circle1, circle2) {
            const dx = circle2.x - circle1.x; // Difference in x-coordinates
            const dy = circle2.y - circle1.y; // Difference in y-coordinates
            const distance = Math.sqrt(dx * dx + dy * dy); // Distance between the centers
        
            // Check if the circles are colliding
            if (distance < circle1.radius + circle2.radius) {
                // Calculate the overlap
                const overlap = circle1.radius + circle2.radius - distance;
        
                // Normalize the direction vector
                const nx = dx / distance;
                const ny = dy / distance;
        
                // The separation vector is the normalized direction vector scaled by the overlap
                const separationX = nx * overlap;
                const separationY = ny * overlap;
        
                return { x: separationX, y: separationY };
            } else {
                return null; // No collision detected
            }
        }
        function getCollisionPointCircleRectangle(circle, rect) {
            // Find the closest point on the rectangle to the circle's center
            const closestX = Math.max(rect.x, Math.min(circle.x, rect.x + rect.width));
            const closestY = Math.max(rect.y, Math.min(circle.y, rect.y + rect.height));
        
            // Calculate the distance between the circle's center and this closest point
            const dx = closestX - circle.x;
            const dy = closestY - circle.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
        
            // Check if the closest point is inside the circle
            if (distance < circle.radius) {
                // Normalize the direction vector from the circle to the closest point
                const nx = dx / distance;
                const ny = dy / distance;
        
                // The collision point is the closest point on the rectangle
                const collisionX = closestX;
                const collisionY = closestY;
        
                // Optionally, you can return the overlap or separation vector
                const overlap = circle.radius - distance;
                const separationX = nx * overlap;
                const separationY = ny * overlap;
        
                return { x: collisionX, y: collisionY, separationX, separationY };
            } else {
                return null; // No collision detected
            }
        }
    
    const obj1 = this

    if (this.geometry.type === 'box2d' && obj2.geometry.type === 'box2d'

    } else if (obj1.geometry.type === 'circle' && obj2.geometry.type === 'circle') {

        return {...collisionPoint, collided:collisionPoint!==null?true:false};
    }
    else if ((obj1.geometry.type === 'circle' && obj2.geometry.type === 'box2d')) {
        const collisionPoint = getCollisionPointCircleRectangle({...obj1, x:obj1.getCenter().x, y:obj1.getCenter().y},{...obj2});

        return {...collisionPoint, collided:collisionPoint!==null?true:false};
    }

function calculateAngleFromPoss(obj1x, obj1y, obj2) {
            const dx = obj2.x - obj1x;
            const dy = obj2.y - obj1y;
            return Math.atan2(dy, dx)+Math.PI;
        }
const castRay = (start, angle, objects)  => {
    const maxDistance = 2000; // Maximum distance a ray can travel
            const stepSize = 1; // Step size for the ray to move forward
            let distance = 0;
        
            let ray = {
                x: start.x,
                y: start.y,
                angle: angle,
                distance: 0
            };
        
            while (distance < maxDistance) {
                distance += stepSize;
                const nextX = ray.x + Math.cos(angle) * stepSize;
                const nextY = ray.y + Math.sin(angle) * stepSize;
        
                // Check for collisions with objects
                let collided = false;
                for (const obj of objects) {
                    if (isPointCollidingWithObject(nextX, nextY, obj)
                ) {
                        ray.x = nextX;
                        ray.y = nextY;
                        ray.distance = distance;
                        collided = true;
                        break;
                    } else if (nextX == 0) {
                        ray.x = nextX - 100;
                        ray.y = nextY;
                        ray.distance = distance;
                        collided = true;
                        break;
                    }
                }
        
                if (collided) break;
        
                ray.x = nextX;
                ray.y = nextY;
                ray.distance = distance;
                
                //return nothing if not collided
                if (distance == maxDistance) {
                    ray.x = null
                    ray.y = null
                    ray.distance = null;
                }
            }
        
            return ray;
}
